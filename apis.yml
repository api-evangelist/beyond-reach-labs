name: Beyond Reach Labs
description: Beyond Reach Labs is a Brooklyn, New York aerospace company building deployable
  solar arrays and thermal radiators for spacecraft that expand from compact launch sizes to
  enormous structures in orbit. Its patented geometry-changing panels grow from the size of a
  dining table to a football field once deployed, giving satellites, orbital data centers,
  commercial space stations, and lunar outposts up to 10x more usable power without adding launch
  mass or volume. Founded by two aerospace engineers, the company is targeting its first in-space
  demonstration in Q2 2027 and is a Y Combinator portfolio company. Beyond Reach Labs is a
  hardware manufacturer and does not currently publish a public API or developer program.
